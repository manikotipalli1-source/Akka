<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EATZY — Owner</title><link rel="shortcut icon" href="../eatzy.png"><style>
:root{--brand:#fc8019;--ink:#202020;--muted:#707070;--bg:#f7f7f7;--line:#e9e9e9;--ok:#10b981;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer}.primary{background:var(--brand);color:#fff}.light{background:#fff;border:1px solid var(--line)}.wrap{max-width:1280px;margin:auto;padding:14px}.login{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.08)}.brand{color:var(--brand);font-size:24px;font-weight:900}.field{display:grid;gap:6px;margin-top:12px}.field label{font-size:13px;font-weight:800}.field input,.field select{padding:12px;border:1px solid var(--line);border-radius:10px}.notice{margin-top:12px;padding:10px 12px;border-radius:10px;background:#fff3ea;color:#934d0a;font-size:13px}.hidden{display:none!important}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}.head{max-width:1280px;margin:auto;padding:11px 14px;display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#ffab59);display:grid;place-items:center;color:#fff;font-weight:900}.spacer{margin-left:auto}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.tabs{display:flex;gap:7px;margin-bottom:12px}.tab{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:800;cursor:pointer}.tab.active{background:#fff3e9;color:var(--brand);border-color:#ffd1b0}.orders{display:grid;gap:10px}.order{border:1px solid var(--line);border-radius:14px;padding:12px}.order-head{display:flex;gap:10px;align-items:center}.token{font-size:22px;font-weight:900;color:var(--brand)}.status{padding:6px 8px;border-radius:999px;background:#fff3ea;color:var(--brand);font-weight:800;font-size:12px}.items{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.5}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.menu-list{display:grid;gap:8px}.menu-row{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px}.menu-row img{width:70px;height:54px;border-radius:9px;object-fit:cover}.badge{font-size:11px;padding:4px 7px;border-radius:999px;background:#f5f5f5;color:#666}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form .full{grid-column:1/-1}.form input,.form select{padding:10px;border:1px solid var(--line);border-radius:10px}.menu-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:620px){.form{grid-template-columns:1fr}.menu-row{grid-template-columns:56px 1fr}.menu-row img{width:56px;height:52px}.menu-actions{grid-column:1/-1;justify-content:flex-start}}
</style></head><body>
<div id="login" class="login"><section class="card"><div class="logo">E</div><div class="brand">EATZY Owner</div><p style="color:var(--muted);line-height:1.5">Owner access is authenticated with Supabase email + password. Only an account assigned to a stall can enter this portal.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:14px" id="loginBtn">Sign in</button><div id="loginNotice" class="notice hidden"></div></section></div>
<div id="app" class="hidden"><header><div class="head"><div class="logo">E</div><div><div style="font-weight:900;color:var(--brand)">EATZY Owner</div><div id="stallLabel" style="font-size:12px;color:var(--muted)"></div></div><div class="spacer"></div><button class="btn light" id="logout">Logout</button></div></header><main class="wrap"><div class="tabs"><button class="tab active" id="ordersTab">Orders</button><button class="tab" id="menuTab">Menu</button></div><section id="ordersPanel" class="panel"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">Orders</h2><span id="counts" style="color:var(--muted);font-size:13px"></span><div class="spacer"></div><button class="btn light" id="refreshOrders">Refresh</button></div><div id="orders" class="orders" style="margin-top:12px"></div></section><section id="menuPanel" class="panel hidden"><div style="display:flex;gap:8px;align-items:center"><div><h2 style="margin:0">Menu</h2><div style="font-size:13px;color:var(--muted)">Create, edit, price, stock and availability for your stall.</div></div><div class="spacer"></div><button class="btn primary" id="newItem">Add item</button></div><div id="menuForm" class="hidden" style="margin-top:12px;border:1px dashed #ffbf95;padding:12px;border-radius:13px"><div class="form"><input id="itemId" type="hidden"><div><label>Name</label><input id="itemName" placeholder="Masala Dosa"></div><div><label>Category</label><input id="itemCategory" placeholder="Tiffins"></div><div><label>Price</label><input id="itemPrice" type="number" min="0" step="0.01"></div><div><label>Stock</label><input id="itemStock" type="number" min="0"></div><div class="full"><label>Image URL</label><input id="itemImage" placeholder="https://..."></div><div><label>Availability</label><select id="itemAvailable"><option value="true">Available</option><option value="false">Sold out / Hidden</option></select></div><div style="display:flex;gap:7px;align-items:end;justify-content:flex-end"><button class="btn light" id="cancelItem">Cancel</button><button class="btn primary" id="saveItem">Save item</button></div></div></div><div id="menuList" class="menu-list" style="margin-top:12px"></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script><script>
const sb=supabase.createClient(window.EATZY_SUPABASE_URL,window.EATZY_SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);let stall=null,orders=[],items=[],channel=null;
function showLoginNotice(t){$('loginNotice').textContent=t;$('loginNotice').classList.remove('hidden')}
async function getOwner(){const {data:{user}}=await sb.auth.getUser();if(!user)return null;const {data:p,error}=await sb.from('profiles').select('id,role,name').eq('id',user.id).single();if(error)throw error;if(p.role!=='vendor'&&p.role!=='admin')throw new Error('This account is not assigned as a vendor/owner.');const {data:s,error:e}=await sb.from('stalls').select('id,name,slug,is_active').eq('owner_id',user.id).maybeSingle();if(e)throw e;if(!s)throw new Error('No stall is assigned to this owner yet. Run the owner setup SQL.');if(!s.is_active)throw new Error('This stall is currently inactive.');return {user,profile:p,stall:s}}
async function loadOrders(){const {data,error}=await sb.from('orders').select('id,token_number,status,total_amount,created_at,order_items(id,item_name,quantity,unit_price),customer:customer_id(phone)').eq('stall_id',stall.id).order('created_at',{ascending:false});if(error)throw error;orders=data||[];renderOrders()}
function renderOrders(){const counts={r:0,p:0,q:0,c:0};orders.forEach(o=>{if(o.status==='Order Received')counts.r++;if(o.status==='Preparing')counts.p++;if(o.status==='Ready for Pickup')counts.q++;if(o.status==='Completed')counts.c++});$('counts').textContent=`New ${counts.r} • Preparing ${counts.p} • Ready ${counts.q} • Completed ${counts.c}`;$('orders').innerHTML=orders.length?orders.map(o=>{const itemsText=(o.order_items||[]).map(i=>`${esc(i.item_name)} × ${i.quantity}`).join(' • ');return `<article class="order"><div class="order-head"><div class="token">${esc(o.token_number)}</div><span class="status">${esc(o.status)}</span><span class="spacer"></span><span style="font-size:12px;color:var(--muted)">${esc(o.customer?.phone||'')}</span></div><div class="items">${itemsText}<br><strong style="color:#222">₹${Number(o.total_amount).toFixed(0)}</strong></div><div class="actions">${o.status==='Order Received'?`<button class="btn primary" onclick="setStatus('${o.id}','Preparing')">Start Preparing</button>`:''}${o.status==='Preparing'?`<button class="btn primary" onclick="setStatus('${o.id}','Ready for Pickup')">Mark Ready</button>`:''}${o.status==='Ready for Pickup'?`<input id="otp-${o.id}" maxlength="4" inputmode="numeric" placeholder="Pickup OTP" style="padding:9px;border:1px solid var(--line);border-radius:9px"><button class="btn primary" onclick="verify('${o.id}')">Verify & Complete</button>`:''}${o.status==='Completed'?'<button class="btn light" disabled>Completed</button>':''}</div></article>`}).join(''):'<div style="padding:30px;text-align:center;color:var(--muted)">No orders yet.</div>'}
async function setStatus(id,status){const {error}=await sb.rpc('set_order_status',{p_order_id:id,p_status:status});if(error)alert(error.message);else await loadOrders()}
async function verify(id){const entered=($('otp-'+id)||{}).value?.trim();if(!/^\d{4}$/.test(entered||''))return alert('Enter the 4-digit pickup OTP.');const {data,error}=await sb.rpc('verify_pickup_otp',{p_order_id:id,p_otp:entered});if(error)return alert(error.message);if(!data)return alert('Incorrect OTP or order is not ready for pickup.');await loadOrders()}
async function loadMenu(){const {data,error}=await sb.from('menu_items').select('id,name,category,price,image_url,is_available,stock').eq('stall_id',stall.id).order('category').order('name');if(error)throw error;items=data||[];renderMenu()}
function renderMenu(){$('menuList').innerHTML=items.length?items.map(x=>`<div class="menu-row"><img src="${x.image_url||'../eatzy.png'}" alt=""><div><strong>${esc(x.name)}</strong><div style="font-size:12px;color:var(--muted)">${esc(x.category)} • ₹${Number(x.price).toFixed(0)} • Stock ${x.stock} ${x.is_available?'<span class="badge">Available</span>':'<span class="badge">Hidden</span>'}</div></div><div class="menu-actions"><button class="btn light" onclick="editItem('${x.id}')">Edit</button><button class="btn light" onclick="toggleItem('${x.id}',${!x.is_available})">${x.is_available?'Hide':'Show'}</button><button class="btn light" onclick="deleteItem('${x.id}')" style="color:var(--danger)">Delete</button></div></div>`).join(''):'<div style="padding:30px;text-align:center;color:var(--muted)">No menu items.</div>'}
function openNew(){for(const id of ['itemId','itemName','itemCategory','itemPrice','itemStock','itemImage'])$(id).value='';$('itemAvailable').value='true';$('menuForm').classList.remove('hidden')};function editItem(id){const x=items.find(i=>i.id===id);if(!x)return;$('itemId').value=x.id;$('itemName').value=x.name;$('itemCategory').value=x.category;$('itemPrice').value=x.price;$('itemStock').value=x.stock;$('itemImage').value=x.image_url||'';$('itemAvailable').value=String(x.is_available);$('menuForm').classList.remove('hidden')}
async function saveItem(){const id=$('itemId').value.trim()||crypto.randomUUID();const row={id,stall_id:stall.id,name:$('itemName').value.trim(),category:$('itemCategory').value.trim()||'Other',price:Number($('itemPrice').value),stock:Number($('itemStock').value),image_url:$('itemImage').value.trim()||null,is_available:$('itemAvailable').value==='true'};if(!row.name||!Number.isFinite(row.price)||row.price<0||!Number.isInteger(row.stock)||row.stock<0)return alert('Enter valid name, price and stock.');const {error}=await sb.from('menu_items').upsert(row);if(error)return alert(error.message);$('menuForm').classList.add('hidden');await loadMenu()}
async function toggleItem(id,val){const {error}=await sb.from('menu_items').update({is_available:val,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else await loadMenu()}
async function deleteItem(id){if(!confirm('Delete this menu item? Existing orders keep their item snapshot.'))return;const {error}=await sb.from('menu_items').delete().eq('id',id);if(error)alert(error.message);else await loadMenu()}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function subscribe(){if(channel)sb.removeChannel(channel);channel=sb.channel('owner-live-'+Date.now()).on('postgres_changes',{event:'*',schema:'public',table:'orders',filter:`stall_id=eq.${stall.id}`},()=>loadOrders()).on('postgres_changes',{event:'*',schema:'public',table:'menu_items',filter:`stall_id=eq.${stall.id}`},()=>loadMenu()).subscribe()}
async function login(){const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return showLoginNotice(error.message);try{const ctx=await getOwner();stall=ctx.stall;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('stallLabel').textContent=stall.name;await loadOrders();await loadMenu();subscribe()}catch(e){await sb.auth.signOut();showLoginNotice(e.message||'Owner setup incomplete.')}}
$('loginBtn').onclick=login;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('ordersTab').onclick=()=>{ $('ordersPanel').classList.remove('hidden');$('menuPanel').classList.add('hidden');$('ordersTab').classList.add('active');$('menuTab').classList.remove('active')};$('menuTab').onclick=()=>{ $('ordersPanel').classList.add('hidden');$('menuPanel').classList.remove('hidden');$('menuTab').classList.add('active');$('ordersTab').classList.remove('active')};$('refreshOrders').onclick=loadOrders;$('newItem').onclick=openNew;$('cancelItem').onclick=()=>$('menuForm').classList.add('hidden');$('saveItem').onclick=saveItem;
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session){try{const ctx=await getOwner();stall=ctx.stall;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('stallLabel').textContent=stall.name;await loadOrders();await loadMenu();subscribe()}catch(e){await sb.auth.signOut();showLoginNotice(e.message)}}})();window.setStatus=setStatus;window.verify=verify;window.editItem=editItem;window.toggleItem=toggleItem;window.deleteItem=deleteItem;
</script></body></html>
